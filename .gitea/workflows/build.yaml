name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']

# Cancel an in-flight run when a newer commit lands on the same branch or
# tag. Protects against build queue buildup during a chain of quick pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: linux-amd64
    # Pin to the same Go patch as the Dockerfile so the toolchain that runs
    # tests is the toolchain that builds the production binary.
    container: golang:1.26.2-alpine
    steps:
      - name: Install system packages
        # alpine is minimal: bring in the tools the lint, biome, and
        # html-validate steps need. bash is required for actions/checkout's
        # bundled scripts; make drives the EmulatorJS fetch; 7zip extracts
        # the upstream EmulatorJS release archive.
        run: apk add --no-cache 7zip bash curl git make nodejs npm

      - uses: actions/checkout@v4

      - name: Install Go tooling
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.3/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.11.3

      - name: Fetch EmulatorJS assets
        run: make fetch-emulatorjs

      - name: gofumpt check
        run: |
          out=$(gofumpt -l .)
          if [ -n "$out" ]; then
            echo "files need formatting:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: biome check
        run: npx --yes @biomejs/biome check frontend/*.js

      - name: html-validate
        run: npx --yes html-validate frontend/*.html

      # `make test` builds dist/freeplay first (test target depends on
      # build). The frontend contract_test.js spawns that binary, so the
      # build must happen before `node --test` runs. Listing go test and
      # node --test as separate steps would skip the build dependency.
      - name: go and frontend tests
        run: make test

  build:
    needs: test
    runs-on: linux-amd64
    container: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install p7zip
        # The upstream EmulatorJS release ships as a .7z archive; the
        # ubuntu base image doesn't include a 7z extractor by default.
        run: apt-get update && apt-get install -y --no-install-recommends p7zip-full

      - name: Fetch EmulatorJS assets
        # The Dockerfile's COPY . . expects emulatorjs/ to already exist in
        # the build context; the directory is gitignored and fetched at build
        # time, so fetch it here before invoking docker build.
        run: make fetch-emulatorjs

      - name: Login to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" \
            | docker login gitea.nas.lab.chris-allen-lane.com \
                -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Compute image tags and build version
        id: meta
        # Every build gets a :sha-<short> tag (immutable, pullable per commit).
        # master additionally gets :latest. A v* tag additionally gets :<tag>
        # and uses the tag name as the VERSION build arg.
        run: |
          REPO="gitea.nas.lab.chris-allen-lane.com/chrisallenlane/freeplay"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAGS="${REPO}:sha-${SHORT_SHA}"
          VERSION="${SHORT_SHA}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS} ${REPO}:${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "master" ]; then
            TAGS="${TAGS} ${REPO}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          args=""
          for tag in ${{ steps.meta.outputs.tags }}; do
            args="$args -t $tag"
          done
          docker build --build-arg VERSION=${{ steps.meta.outputs.version }} $args .

      - name: Push image
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker push "$tag"
          done
