name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: emulatorjs
        run: echo "sha=$(grep '^EMULATORJS_SHA256' Makefile | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache EmulatorJS assets
        uses: actions/cache@v4
        with:
          path: emulatorjs
          key: emulatorjs-${{ steps.emulatorjs.outputs.sha }}

      - name: Install Go linting tools
        run: make setup

      - name: Run checks
        run: make check

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - id: emulatorjs
        run: echo "sha=$(grep '^EMULATORJS_SHA256' Makefile | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache EmulatorJS assets
        uses: actions/cache@v4
        with:
          path: emulatorjs
          key: emulatorjs-${{ steps.emulatorjs.outputs.sha }}

      - name: Fetch EmulatorJS assets
        run: make fetch-emulatorjs

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
