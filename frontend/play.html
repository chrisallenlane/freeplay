<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freeplay - Player</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/subpage.css">
    <link rel="stylesheet" href="/play.css">
    <script>
        // Inline theme-init: runs before CSS paint so the saved theme
        // is applied without a flash. Toggle wiring lives in theme.js.
        (() => {
            var s = localStorage.getItem("freeplay-theme");
            document.documentElement.dataset.theme = s ||
                (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        })();
    </script>
    <script src="/theme.js" defer></script>
    <script src="/urls.js" defer></script>
    <script src="/input.js" defer></script>
    <script src="/api.js" defer></script>
    <script src="/utils.js" defer></script>
    <script src="/sram.js" defer></script>
    <script src="/postSave.js" defer></script>
    <script src="/loadState.js" defer></script>
    <script src="/play.js" defer></script>
</head>
<body>
    <header>
        <a href="/" class="btn header-btn">Back to Library</a>
        <button type="button" id="theme-toggle" class="btn header-btn" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
    </header>
    <main>
        <div id="game"></div>
        <div id="error" class="error-msg" role="alert" style="display:none;"></div>
    </main>
</body>
</html>
